<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cutly-Ai辅助影视本地化工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ===== OpenCut 真实设计令牌（dark 主题） ===== */
  :root{
    --background: hsl(0,0%,5%);
    --foreground: hsl(0,0%,87%);
    --card: hsl(0,0%,5%);
    --card-foreground: hsl(0,0%,87%);
    --popover: hsl(0,0%,5%);
    --popover-hover: hsl(0,0%,13%);
    --popover-foreground: hsl(0,0%,95%);
    --primary: hsl(200,90%,52%);
    --primary-foreground: hsl(0,0%,100%);
    --secondary: hsl(204,100%,12%);
    --secondary-border: hsl(204,100%,15%);
    --secondary-foreground: hsl(200,98%,61%);
    --muted: hsl(0,0%,20%);
    --muted-foreground: hsl(0,0%,50%);
    --accent: hsl(0,0%,14%);
    --accent-foreground: hsl(0,0%,95%);
    --border: hsl(0,0%,16%);
    --input: hsl(0,0%,5%);
    --ring: hsl(0,0%,50%);
    --destructive: hsl(0,83%,50%);
    --constructive: hsl(141,71%,48%);
    --sidebar: hsl(0,0%,6%);
    --sidebar-background: hsl(0,0%,8%);
    --sidebar-border: hsl(0,0%,20%);
    --radius-lg: 0.82rem; --radius-md: 0.65rem; --radius-sm: 0.35rem;
  }
  .panel{ --background: hsl(0,0%,10%); --foreground: hsl(0,0%,85%);
    --border: hsl(0,0%,18%); --accent: hsl(0,0%,15%); --muted: hsl(0,0%,22%); }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--background); color: var(--foreground);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC','Microsoft YaHei', sans-serif;
    font-size:14px; -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  ::selection{ background: color-mix(in srgb, var(--primary) 35%, transparent); }
  .scrollbar-thin::-webkit-scrollbar{ width:8px; height:8px; }
  .scrollbar-thin::-webkit-scrollbar-thumb{ background: var(--border); border-radius:4px; }
  .scrollbar-thin::-webkit-scrollbar-track{ background:transparent; }
  .scrollbar-hidden::-webkit-scrollbar{ display:none; }
  .scrollbar-hidden{ scrollbar-width:none; }

  /* ===== 布局骨架 ===== */
  #app{ display:flex; flex-direction:column; height:100vh; width:100vw; overflow:hidden; }
  header.topbar{ height:3.4rem; min-height:3.4rem; display:flex; align-items:center; justify-content:space-between; padding:0 12px; gap:8px; }
  .main-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .editor-row{ flex:1; min-height:0; display:flex; gap:3px; padding:0 12px; }
  .col-left{ width:320px; min-width:260px; max-width:440px; }
  .col-center{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .col-right{ width:288px; min-width:220px; max-width:400px; }
  .panel{ background:var(--background); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; display:flex; flex-direction:column; height:100%; }

  .timeline-wrap{ height:38%; min-height:200px; display:flex; flex-direction:column; padding:0 12px 12px; gap:3px; }
  .timeline-panel{ flex:1; min-height:0; }
  .splitter{ height:6px; cursor:row-resize; background:transparent; }
  .splitter:hover{ background:var(--border); }

  /* ===== 顶栏 ===== */
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand-logo{ width:30px; height:30px; border-radius:7px; background:var(--primary); display:flex; align-items:center; justify-content:center; color:#fff; }
  .proj-name{ font-size:0.9rem; height:32px; padding:0 8px; border-radius:var(--radius-sm); background:transparent; border:1px solid transparent; color:var(--foreground); outline:none; }
  .proj-name:hover{ background:var(--accent); }
  .proj-name:focus{ border-color:var(--ring); background:transparent; }
  .topbar-nav{ display:flex; align-items:center; gap:8px; }

  /* ===== 按钮 ===== */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; border:1px solid transparent; padding:8px 14px; line-height:1; }
  .btn svg{ width:16px; height:16px; flex-shrink:0; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; pointer-events:none; }
  .btn-default{ background:var(--foreground); color:var(--background); }
  .btn-default:hover{ opacity:.9; }
  .btn-secondary{ background:var(--secondary); color:var(--secondary-foreground); border-color:var(--secondary-border); }
  .btn-secondary:hover{ filter:brightness(1.15); }
  .btn-ghost{ background:transparent; color:var(--foreground); }
  .btn-ghost:hover{ background:var(--accent); }
  .btn-outline{ background:var(--background); border-color:var(--border); color:var(--foreground); }
  .btn-outline:hover{ background:var(--accent); }
  .btn-text{ background:transparent; padding:6px; color:var(--foreground); border-radius:var(--radius-sm); }
  .btn-text:hover{ opacity:.7; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .icon-btn{ width:32px; height:32px; border-radius:var(--radius-sm); display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--muted-foreground); border:1px solid transparent; cursor:pointer; }
  .icon-btn:hover{ background:var(--accent); color:var(--foreground); }
  .icon-btn.active{ background:var(--secondary); color:var(--secondary-foreground); border-color:var(--secondary-border); }
  .icon-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .icon-btn svg{ width:18px; height:18px; }

  /* ===== 左栏 tab ===== */
  .rail{ display:flex; flex-direction:row; align-items:center; gap:2px; padding:5px 8px; border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0; }
  .rail .icon-btn{ width:auto; min-width:auto; height:32px; padding:0 12px; border:1px solid transparent; border-radius:var(--radius-sm); }
  .rail .icon-btn.active{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .rail .icon-btn .rl{ font-size:12px; margin-left:5px; }
  .rail-content{ flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
  .rail-title{ font-size:12px; font-weight:600; color:var(--muted-foreground); padding:6px 12px 4px; }
  .pane{ flex:1; min-height:0; overflow-y:auto; padding:8px 10px; }
  .separator-v{ width:1px; background:var(--border); }

  /* ===== 中央预览（16:9 / 9:16 自适应，绝不溢出/裁切） ===== */
  .preview-body{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:8px; position:relative; background:#000; overflow:hidden; }
  /* stage 绝对铺满预览区 => 有确定尺寸，video 用 width/height:100% + object-fit:contain 才能可靠 letterbox */
  .preview-stage{ position:absolute; inset:8px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .output-frame{ position:relative; }
  .crop-layer{ position:absolute; inset:0; width:100%; height:100%; }
  .transform-layer{ position:absolute; inset:0; width:100%; height:100%; transform-origin:center center; will-change:transform; }
  video.preview-video{ width:100%; height:100%; object-fit:contain; background:#000; border-radius:4px; display:block; }
  video.timeline-layer{ position:absolute; inset:0; }
  .preview-empty{ color:var(--muted-foreground); text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .preview-toolbar{ height:40px; min-height:40px; border-top:1px solid var(--border); display:flex; align-items:center; gap:10px; padding:0 12px; color:var(--muted-foreground); }
  .tc{ font-variant-numeric:tabular-nums; font-size:12px; color:var(--foreground); }

  /* 视频上字幕叠加层（实时显示当前句，随信箱比例定位到视频实际区域） */
  .subtitle-overlay{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:5; overflow:hidden; }
  .image-overlay{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .image-overlay .image-item{ position:absolute; width:30%; transform:translate(-50%,-50%); transform-origin:center; pointer-events:auto; cursor:move; user-select:none; }
  .image-overlay img{ display:block; width:100%; height:auto; max-width:none; }
  .image-resize{ position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; border:2px solid #fff; border-radius:3px; background:var(--primary); cursor:nwse-resize; box-shadow:0 1px 4px #000; }
  .sub-anchor{ position:absolute; transform:translate(-50%,-50%); max-width:100%; text-align:center; line-height:1.25;
    font-family:'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; pointer-events:auto; cursor:grab;
    text-shadow:0 1px 2px rgba(0,0,0,.6); user-select:none; word-break:break-word; box-sizing:border-box; }
  .sub-anchor.dragging{ cursor:grabbing; }
  .sub-anchor::after{ content:'⠿'; position:absolute; right:-18px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.5; }
  .sub-resize{ position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; border:2px solid #fff; border-radius:3px; background:var(--primary); cursor:nwse-resize; box-shadow:0 1px 4px #000; }

  /* 视频预览区底部居中的播放/暂停键（始终显示，点击切换） */
  .video-play-overlay{ position:absolute; left:50%; bottom:18px; transform:translateX(-50%); width:48px; height:48px;
    border-radius:50%; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.35); color:#fff;
    display:none; align-items:center; justify-content:center; cursor:pointer; z-index:7; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .video-play-overlay svg{ width:24px; height:24px; margin-left:0; }
  .video-play-overlay:hover{ background:rgba(0,0,0,.78); border-color:rgba(255,255,255,.6); }

  /* 字幕样式面板 */
  .style-card .row{ justify-content:space-between; }
  .style-card label.small{ margin:0; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{ width:24px; height:24px; border-radius:6px; border:2px solid transparent; cursor:pointer; }
  .swatch.on{ border-color:var(--primary); }
  .pos-group{ display:flex; gap:4px; }
  .pos-group button{ flex:1; }
  .inline-field{ display:flex; align-items:center; gap:8px; }
  .inline-field input[type=range]{ flex:1; accent-color:var(--primary); }
  .inline-field .val{ font-size:11px; color:var(--muted-foreground); min-width:34px; text-align:right; }
  input[type=color]{ width:34px; height:26px; padding:0; border:1px solid var(--border); border-radius:6px; background:transparent; cursor:pointer; }

  /* ===== 右栏属性 ===== */

  /* ===== 字幕精修列表 ===== */
  .seg{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px; margin-bottom:8px; background:var(--panel,var(--background)); }
  .seg.sel{ border-color:var(--primary); }
  .seg.playhead-seg{ border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
  .seg.hidden-seg{ opacity:.45; }
  .seg-head{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:6px; }
  .seg-time{ font-size:11px; color:var(--muted-foreground); font-variant-numeric:tabular-nums; }
  .seg textarea{ width:100%; resize:vertical; min-height:42px; background:var(--input); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--foreground); padding:6px 8px; font-size:13px; font-family:inherit; outline:none; }
  .seg textarea:focus{ border-color:var(--ring); }
  .gender-toggle{ display:inline-flex; flex-wrap:wrap; border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
  .gender-toggle button{ background:transparent; color:var(--muted-foreground); border:none; padding:4px 6px; font-size:12px; cursor:pointer; }
  .gender-toggle button.on-f{ background:#BA5D7A; color:#fff; }
  .gender-toggle button.on-m{ background:#5d93ba; color:#fff; }
  .gender-toggle button.on-n{ background:#7a6bb7; color:#fff; }
  .refine-head{ position:sticky; top:0; z-index:4; padding:8px 0; background:var(--panel,var(--background)); }
  /* 多选 + 逐行样式色块 */
  .seg-ck{ width:16px; height:16px; accent-color:var(--primary); flex-shrink:0; cursor:pointer; }
  .seg-top{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .seg-idx{ font-size:11px; color:var(--muted-foreground); font-weight:600; }
  .seg-in{ width:46px; background:var(--input); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--foreground); padding:2px 4px; font-size:11px; font-family:inherit; }
  .seg-arrow{ color:var(--muted-foreground); font-size:11px; }
  .seg-spacer{ flex:1; }
  .seg-sw{ width:14px; height:14px; border-radius:3px; border:1px solid var(--border); flex-shrink:0; cursor:pointer; }
  .btn-outline.danger{ border-color:var(--destructive); color:var(--destructive); }

  /* ===== 时间轴 ===== */
  .tl-toolbar{ height:40px; min-height:40px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 8px; gap:8px; }
  .tl-tools{ display:flex; align-items:center; gap:2px; }
  .tl-divider{ width:1px; height:24px; background:var(--border); margin:0 4px; }
  .tl-body{ flex:1; min-height:0; overflow:auto; display:flex; flex-direction:column; }
  .tl-tracks{ display:flex; flex-direction:column; min-height:100%; position:relative; }
  .track{ display:flex; align-items:stretch; border-bottom:1px solid var(--border); min-height:46px; position:relative; }
  .track-label{ width:88px; min-width:88px; padding:6px 8px; font-size:11px; color:var(--muted-foreground); display:flex; align-items:center; gap:6px; border-right:1px solid var(--border); background:var(--background); position:sticky; left:0; z-index:3; }
  .track-label .eye{ margin-left:auto; cursor:pointer; opacity:.6; }
  .track-label .eye:hover{ opacity:1; }
  .track-label .eye.off{ color:var(--muted-foreground); }
  .track-label .lbtn{ cursor:pointer; opacity:.6; display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:4px; }
  .track-label .lbtn:hover{ opacity:1; background:var(--border); }
  .track-label .lbtn.off{ opacity:.35; }
  .track-label .lbtn.dub{ color:var(--primary); }
  .add-track-wrap{ position:relative; }
  .add-track-menu{ position:absolute; top:30px; left:0; z-index:20; background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.25); padding:4px; display:flex; flex-direction:column; min-width:110px; }
  .add-track-menu button{ text-align:left; padding:6px 10px; border:none; background:transparent; color:var(--foreground); border-radius:6px; cursor:pointer; font-size:13px; }
  .add-track-menu button:hover{ background:var(--primary); color:#fff; }
  .track.clip-audio.dubbed{ box-shadow: inset 0 0 0 2px var(--primary); }
  .refine-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
  .refine-head .btn{ width:auto; padding:4px 10px; font-size:12px; }
  /* 时间轴放大时必须保留按秒计算出的真实宽度，不能被 flex-shrink 压回视口宽度。 */
  .track-clips{ flex:0 0 auto; position:relative; min-height:46px; }
  .clip{ position:absolute; top:5px; bottom:5px; border-radius:5px; padding:4px 7px; font-size:11px; color:#fff; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; cursor:pointer; border:1px solid rgba(255,255,255,.15); touch-action:none; }
  .clip:hover{ filter:brightness(1.1); }
  .clip.sel{ outline:2px solid var(--primary); outline-offset:1px; z-index:4; }
  .clip.clip-hidden{ opacity:.32; }
  .clip-video{ background:linear-gradient(180deg,#2a2a2a,#1a1a1a); color:var(--muted-foreground); }
  .clip-sub{ background:#5DBAA0; }
  .clip-dub{ background:#8F5DBA; }
  /* 片段左右边缘拖拽手柄（改入/出点） */
  .clip-handle{ position:absolute; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:7; background:transparent; touch-action:none; }
  .clip-handle.left{ left:0; border-left:2px solid rgba(255,255,255,.45); }
  .clip-handle.right{ right:0; border-right:2px solid rgba(255,255,255,.45); }
  .clip-handle:hover{ background:rgba(255,255,255,.22); }
  .clip-audio{ background:#3B82C4; }
  .badge{ display:inline-block; font-size:9px; font-weight:700; padding:0 4px; border-radius:3px; margin-right:4px; vertical-align:middle; }
  .badge-f{ background:#BA5D7A; color:#fff; }
  .badge-m{ background:#5d93ba; color:#fff; }

  /* 刻度尺 */
  .ruler-track{ min-height:28px; }
  .ruler-clips{ cursor:pointer; background:repeating-linear-gradient(90deg,transparent,transparent 59px, var(--border) 59px, var(--border) 60px); }
  .tick{ position:absolute; top:0; height:100%; border-left:1px solid var(--border); padding-left:3px; font-size:10px; line-height:1; color:var(--muted-foreground); font-variant-numeric:tabular-nums; pointer-events:none; display:flex; align-items:center; }
  .playhead{ position:absolute; top:0; bottom:0; width:2px; background:var(--primary); z-index:6; pointer-events:none; box-shadow:0 0 0 1px rgba(0,0,0,.4); }
  .playhead::before{ content:""; position:absolute; top:-1px; left:-5px; width:12px; height:12px; background:var(--primary); clip-path:polygon(0 0,100% 0,50% 100%); }

  /* 片段浮出工具条（抄 OpenCut） */
  .clip-toolbar{ position:absolute; display:flex; gap:2px; background:var(--popover-hover); border:1px solid var(--border); border-radius:6px; padding:3px; z-index:8; box-shadow:0 6px 18px rgba(0,0,0,.55); }
  .ct-btn{ width:28px; height:28px; border-radius:5px; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--foreground); border:none; cursor:pointer; }
  .ct-btn:hover{ background:var(--accent); }
  .ct-btn.danger:hover{ background:var(--destructive); }
  .ct-btn svg{ width:16px; height:16px; }
  .ct-row{ display:flex; align-items:center; gap:6px; }
  .ct-row + .ct-row{ margin-top:5px; }
  .ct-btn-text{ font-size:12px; padding:4px 9px; border-radius:5px; background:transparent; color:var(--foreground); border:1px solid var(--border); cursor:pointer; white-space:nowrap; }
  .ct-btn-text:hover{ background:var(--accent); }
  .ct-audio-params label{ font-size:11px; color:var(--muted-foreground); display:inline-flex; align-items:center; gap:4px; }
  .ct-audio-params input{ accent-color:var(--primary); }
  .ct-progress{ width:170px; height:6px; border-radius:99px; overflow:hidden; background:var(--border); }
  .ct-progress > i{ display:block; height:100%; background:var(--primary); transition:width .35s ease; }
  .timeline-task-progress{ display:none; align-items:center; gap:10px; margin:7px 10px 9px; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--accent); font-size:12px; }
  .timeline-task-progress .bar{ flex:1; height:7px; border-radius:99px; overflow:hidden; background:var(--border); }
  .timeline-task-progress .bar i{ display:block; height:100%; background:var(--primary); transition:width .35s ease; }
  .clip-audio{ cursor:pointer; }

  /* ===== 杂项 ===== */
  .status-dot{ width:8px; height:8px; border-radius:50%; display:inline-block; }
  .s-uploaded{ background:var(--muted-foreground); }
  .s-running{ background:var(--primary); animation:pulse 1s infinite; }
  .s-ready{ background:var(--constructive); }
  .s-error{ background:var(--destructive); }
  @keyframes pulse{ 50%{ opacity:.3; } }
  .pill{ font-size:11px; padding:3px 8px; border-radius:999px; background:var(--accent); color:var(--foreground); }
  .field{ width:100%; background:var(--input); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--foreground); padding:7px 9px; font-size:13px; outline:none; font-family:inherit; }
  .field:focus{ border-color:var(--ring); }
  select.field{ cursor:pointer; }
  .muted{ color:var(--muted-foreground); }
  .small{ font-size:12px; }
  .hint{ font-size:11px; color:var(--muted-foreground); line-height:1.5; }
  .row{ display:flex; align-items:center; gap:8px; }
  .col{ display:flex; flex-direction:column; gap:8px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .card{ border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; }
  .card h4{ margin:0 0 6px; font-size:12px; color:var(--muted-foreground); font-weight:600; }
  .step-list{ display:flex; flex-direction:column; gap:6px; }
  .step{ display:flex; align-items:center; gap:8px; font-size:12px; padding:6px 8px; border-radius:var(--radius-sm); background:var(--accent); }
  .step .n{ width:18px; height:18px; border-radius:50%; background:var(--background); color:var(--muted-foreground); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; flex-shrink:0; }
  .step.done .n{ background:var(--constructive); color:#fff; }
  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--popover-hover); border:1px solid var(--border); color:var(--foreground); padding:10px 16px; border-radius:var(--radius-md); font-size:13px; z-index:999; box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .toast.err{ border-color:var(--destructive); }
  .upload-drop{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:22px; text-align:center; color:var(--muted-foreground); cursor:pointer; }
  .upload-drop:hover{ border-color:var(--primary); color:var(--foreground); }
  .media-thumb{ width:100%; aspect-ratio:16/9; background:#000; border-radius:var(--radius-sm); border:1px solid var(--border); object-fit:contain; }
  /* 媒体库：全部上传文件网格，可滚动查看 */
  #mediaList{ display:grid; grid-template-columns:1fr 1fr; gap:8px; max-height:calc(100vh - 320px); overflow:auto; padding-right:2px; align-content:start; }
  .media-item{ background:var(--background); border:1px solid var(--border); border-radius:var(--radius-sm); overflow:hidden; }
  .media-thumb-wrap{ position:relative; }
  .media-thumb.media-ico{ display:flex; align-items:center; justify-content:center; font-size:26px; aspect-ratio:16/9; }
  .media-add{ position:absolute; right:5px; bottom:5px; width:26px; height:26px; border-radius:50%; border:none; background:var(--primary); color:#fff; font-size:18px; line-height:1; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; }
  .media-add:hover{ filter:brightness(1.12); }
  .media-add:disabled{ background:var(--constructive); cursor:default; }
  .media-menu{ position:fixed; z-index:60; background:var(--card); border:1px solid var(--border); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.35); padding:4px; display:flex; flex-direction:column; min-width:134px; }
  .media-menu button{ text-align:left; padding:7px 10px; border:none; background:transparent; color:var(--foreground); border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:6px; }
  .media-menu button:hover{ background:var(--primary); color:#fff; }
  .media-menu button.danger:hover{ background:#c0392b; color:#fff; }
  .media-meta{ padding:5px 7px; display:flex; flex-direction:column; gap:2px; }
  .media-name{ font-size:12px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .media-kind{ font-size:10px; color:var(--muted-foreground); }
  /* 轨道拖拽排序 */
  .track-label{ cursor:grab; user-select:none; touch-action:none; }
  .track-label.dragging{ opacity:.4; }
  .track.active-subtitle .track-label{ color:var(--foreground); background:var(--accent); box-shadow:inset 3px 0 0 var(--primary); }
  .track.track-hidden .track-clips{ opacity:.32; }
  .track.drag-over{ outline:2px dashed var(--primary); outline-offset:-2px; }
  .spinner{ width:14px; height:14px; border:2px solid var(--muted-foreground); border-top-color:var(--foreground); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .hidden{ display:none !important; }
  .project-library{ position:fixed; inset:0; z-index:1000; background:rgba(9,12,18,.62); display:flex; align-items:flex-start; justify-content:center; padding:8vh 18px 24px; }
  .project-library-panel{ width:min(760px,100%); max-height:84vh; overflow:auto; background:var(--popover); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:0 24px 70px rgba(0,0,0,.55); padding:18px; }
  .project-library-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .project-list{ display:grid; gap:8px; }
  .project-item{ border:1px solid var(--border); background:var(--card); border-radius:var(--radius-md); padding:12px; cursor:pointer; text-align:left; color:var(--foreground); }
  .project-item:hover{ border-color:var(--primary); background:var(--accent); }
  .project-item.active{ border-color:var(--primary); box-shadow:inset 3px 0 0 var(--primary); }
  .project-item-head{ display:flex; align-items:center; gap:8px; }
  .project-item-check{ width:28px; height:28px; flex:0 0 auto; border-radius:7px; }
  .project-item-check.selected,.project-toolbar-btn.selected{ color:#fff; background:var(--primary); border-color:var(--primary); }
  .project-item-delete{ margin-left:auto; color:var(--destructive); }
  .project-toolbar{ display:flex; align-items:center; gap:5px; }
  .project-toolbar-btn{ width:32px; height:32px; border-radius:7px; }
  .project-toolbar-btn:disabled{ opacity:.35; cursor:not-allowed; }
  .project-selection-count{ min-width:22px; text-align:center; font-size:11px; }
  .project-item-actions{ margin-left:auto; display:flex; align-items:center; gap:5px; min-width:0; }
  .project-subtitle-select{ width:150px; height:28px; font-size:11px; padding:3px 6px; }
  .project-item-title{ font-weight:700; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .project-item-meta{ margin-top:6px; color:var(--muted-foreground); font-size:12px; display:flex; gap:10px; flex-wrap:wrap; }
  .project-batch-results{ display:flex; align-items:center; gap:4px; flex:0 0 auto; }

  .project-batch-result.success{ color:#197a44; background:rgba(41,173,101,.13); border-color:rgba(41,173,101,.32); }

<script>
const PREFIX = "/d";
const APP_VER = "v20260904015";   // 前端版本号（仅作显示，手动 Ctrl+Shift+R 刷新后更新；此后 JS 改动 +1）
const LANG_NAME = { my:"缅甸语", en:"英语", fil:"菲律宾语", id:"印尼语", jv:"爪哇语", km:"高棉语", lo:"老挝语", ms:"马来语", su:"巽他语", ta:"泰米尔语", th:"泰语", vi:"越南语", zh:"中文" };

// 字幕样式默认值（与后端 SubStyleUpdate 对齐）
const DEFAULT_SUB_STYLE = { font_size:30, color:"#FFFFFF", bg:false, bg_color:"#000000", bg_opacity:0.55, bold:false, outline:false, position:"bottom", x:0.5, y:0.85, font:"", box_width:0.92, box_height:0 };

const state = { jid:null, job:null, segs:[], selected:null, duration:0, pollTimer:null, zoom:0.4, lang:"km", gender:"female", videoClips:[], tracks:[], selClip:null, subStyle:{...DEFAULT_SUB_STYLE}, selRows:new Set(), lastSel:null, subShift:0, dragging:false, timelineSaving:false, activeSubtitleTid:null };

function hexA(hex, a){ const h=(hex||"#000000").replace('#',''); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16); return `rgba(${r},${g},${b},${a})`; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function clientLog(event, detail='', path=''){
  try{
    const p=path||''; if(p.includes('/client-log')||p==='/api/auth/status'||(p==='/api/jobs' && !detail)) return;
    fetch(PREFIX+'/api/client-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event:String(event).slice(0,80),detail:String(detail).slice(0,500),jid:state.jid||'',tid:(state.selClip&&state.selClip.tid)||'',client_at:new Date().toISOString()})}).catch(()=>{});
    console.debug('[Cutly]',event,detail);
  }catch(_){ }
}

/* ---------- 工具 ---------- */
function $(id){ return document.getElementById(id); }
function toast(msg, isErr){ const t=document.createElement('div'); t.className='toast'+(isErr?' err':''); t.textContent=msg; $('toastBox').appendChild(t); setTimeout(()=>t.remove(),3200); }
let _authPrompting=null;
async function ensureAuth(){
  if(_authPrompting) return _authPrompting;
  _authPrompting=(async()=>{
    const key=window.prompt('请输入 Cutly 访问密钥');
    if(key===null) throw new Error('已取消登录');
    const r=await fetch(PREFIX+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    if(!r.ok) throw new Error(r.status===401?'访问密钥错误':'登录失败 HTTP '+r.status);
  })();
  try{ await _authPrompting; } finally { _authPrompting=null; }
}
async function api(path, opts, retried){
  const method=(opts&&opts.method)||'GET';
  if(method!=='GET') clientLog('api_start',method+' '+path,path);
  const r = await fetch(PREFIX+path, opts);
  if(r.status===401 && !retried){ await ensureAuth(); return api(path, opts, true); }
  if(!r.ok){ let m=''; try{ const d=(await r.json()).detail; m=typeof d==='string'?d:(Array.isArray(d)?d.map(x=>x.msg||JSON.stringify(x)).join('；'):JSON.stringify(d||'')); }catch(e){} clientLog('api_error',method+' '+path+' HTTP '+r.status+' '+m,path); throw new Error(m||('HTTP '+r.status)); }
  if(method!=='GET') clientLog('api_ok',method+' '+path,path);
  const ct = r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r;
}
function fmt(t){ if(t==null||isNaN(t)) return '00:00.0'; const m=Math.floor(t/60), s=Math.floor(t%60), d=Math.floor((t*10)%10); return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+d; }

const VOICE_TAG_RE=/^\s*\[(w2|女2|f2|female2|m2|男2|male2|n2|旁白2|narrator2|w|女|f|female|m|男|male|n|旁白|narrator)\]\s*/i;
const VOICE_CODE_TO_ID={f:'female',f2:'female2',m:'male',m2:'male2',n:'narration',n2:'narration2'};
const VOICE_LABEL={f:'女声1',f2:'女声2',m:'男声1',m2:'男声2',n:'旁白1',n2:'旁白2'};
function voiceCode(cue){
  if(cue&&typeof cue==='object'&&cue.voice) return ({female:'f',female2:'f2',male:'m',male2:'m2',narration:'n',narration2:'n2'})[cue.voice]||'';
  const m=String(cue||'').match(VOICE_TAG_RE); if(!m) return ''; const t=m[1].toLowerCase();
  if(['w2','女2','f2','female2'].includes(t)) return 'f2'; if(['w','女','f','female'].includes(t)) return 'f';
  if(['m2','男2','male2'].includes(t)) return 'm2'; if(['m','男','male'].includes(t)) return 'm';
  return ['n2','旁白2','narrator2'].includes(t)?'n2':'n';
}
function setVoiceCode(cue, code){ cue.voice=VOICE_CODE_TO_ID[code]||'female'; cue.text=String(cue.text||'').replace(VOICE_TAG_RE,''); }

function syncRefineToPlayhead(){

/* ---------- 轨道删减 / 拖拽排序 / 片段移动 ---------- */
function reorderTrack(from, to){
  if(!from || from===to) return;
  const arr=state.tracks; const fi=arr.findIndex(t=>t.id===from); const ti=arr.findIndex(t=>t.id===to);
  if(fi<0||ti<0) return;
  pushHistory();
  const [m]=arr.splice(fi,1);
  const target=arr.findIndex(t=>t.id===to);
  arr.splice(target<0?arr.length:target,0,m);   // 列表靠前 = 图层更靠上
  renderTracks(); syncPreviewSource(); saveTracks();
}
async function moveTrack(tid, delta){
  const arr=state.tracks; const i=arr.findIndex(t=>t.id===tid); if(i<0) return;
  const ni=i+delta; if(ni<0||ni>=arr.length) return;
  pushHistory(); const [m]=arr.splice(i,1); arr.splice(ni,0,m);
  renderTracks();
  try{ await saveTracks(); toast(delta<0?'已上移':'已下移'); }catch(_){ toast('轨道顺序保存失败'); }
}
/* ---------- 全局拖拽管理器（Pointer Events + 指针捕获，杜绝卡死/事件泄漏） ---------- */
let _drag=null;
function _cleanupDragOver(){ const q=document.querySelectorAll('.track.drag-over'); for(const r of q) r.classList.remove('drag-over'); }
/* 统一拖拽：document 级监听 + 超时兜底，不依赖 setPointerCapture（避免 pointerup 丢失后元素永久捕获指针导致整页卡死、连播放都点不动） */
function beginDrag(info, onMove, onEnd){
  if(_drag) return;
  _drag=info; state.dragging=true;
  const move=(ev)=>{ try{ onMove(ev); }catch(_){} };
  const end=(ev)=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',end);
    document.removeEventListener('pointercancel',end);
    _drag=null; state.dragging=false; _cleanupDragOver();
    try{ onEnd(ev); }catch(_){}
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',end);
  document.addEventListener('pointercancel',end);
  setTimeout(()=>{ if(_drag===info) end({clientX:0,clientY:0,pointerId:-1,button:0}); }, 8000);  // 超时兜底，杜绝永久卡死
}
window.addEventListener('blur', ()=>{ if(_drag){ _drag=null; state.dragging=false; _cleanupDragOver(); } });

// 轨道上下排序（按住 label 或轨道空白处上下拖动；按钮/片段不触发）
function startTrackReorder(tid, e){
  if(_drag) return;
  if(e.button!==0) return;
  if(e.target.closest('.clip')||e.target.closest('.clip-handle')||e.target.closest('.lbtn')) return;
  e.preventDefault();
  const wrap=$('tracks'); const arr=state.tracks;
  const fi=arr.findIndex(t=>t.id===tid); if(fi<0) return;
  const rows=[...wrap.querySelectorAll('.track[data-tid]')];
  if(rows.length<2) return;
  const startY=e.clientY; let moved=false, lastRow=null;
  beginDrag({type:'reorder'},
    (ev)=>{
      if(Math.abs(ev.clientY-startY)>5) moved=true;
      if(!moved) return;
      let t=null;
      for(const r of rows){ const rc=r.getBoundingClientRect(); t=r; if(ev.clientY < rc.top+rc.height/2) break; }
      if(t!==lastRow){ if(lastRow) lastRow.classList.remove('drag-over'); if(t) t.classList.add('drag-over'); lastRow=t; }
    },
    (ev)=>{ if(moved && lastRow && lastRow.dataset.tid && lastRow.dataset.tid!==tid) reorderTrack(tid, lastRow.dataset.tid); }
  );
}
// 视频/图片/字幕片段：按住左右拖动改变时间位置（不改变时长，仅平移）
function startClipMove(tid, kind, i, e){
  if(_drag) return;
  if(e.button!==0) return;
  e.preventDefault();
  const tr=trackById(tid); if(!tr) return;
  const c = (kind==='subtitle') ? tr.cues[i] : tr.clips[i];
  if(!c) return;
  const pps=pxPerSec(); const startX=e.clientX; const oS=c.start, oE=c.end;
  let moved=false;
  beginDrag({type:'clipmove'},
    (ev)=>{ const dx=ev.clientX-startX; if(Math.abs(dx)>3) moved=true; const dt=dx/pps;
      let ns=Math.max(0, oS+dt), ne=Math.max(ns+0.1, oE+dt);
      c.start=ns; c.end=ne;
      const node=document.querySelector(`.clip[data-track="${tid}"][data-i="${i}"]`);
      if(node){ node.style.left=(ns*pps)+'px'; node.title=(kind==='subtitle'?c.text:(kindName(kind)+' '))+fmtSec(ns)+'–'+fmtSec(ne); }
    },
    (ev)=>{ if(moved){ pushHistory(); saveTracks().then(()=>renderTracks()).catch(()=>{}); if(kind==='audio') updateAudioPreviewLayers(video.currentTime||0); }   // 拖动了 = 提交位置
      else { selectClip(tid,kind,i,e); } }   // 未拖动 = 视为点击选中（字幕支持 Ctrl/Shift 多选）
  );
}

function renderTracks(){
  if(state.dragging) return;   // 拖拽中：不重渲染时间轴，避免轮询/提交替换 DOM 节点导致拖拽目标丢失；拖拽结束会自动 renderTracks
  const wrap=$('tracks'); const j=state.job; if(!j){ wrap.innerHTML=''; return; }
  const rawDur = state.duration;
  const dur = (rawDur && isFinite(rawDur) && rawDur>1) ? rawDur : (maxSegEnd()||60);
  const pps = pxPerSec();
  const totalW = Math.max(dur*pps, (wrap.clientWidth-88)||600);
  const labelW = 88;
  let html='';

  // 刻度尺
  let ticks='';
  const step = Math.max(1, Math.round(70/pps));
  for(let t=0; t<=dur; t+=step){ ticks+=`<div class="tick" style="left:${t*pps}px;">${fmtSec(t)}</div>`; }
  html += `<div class="track ruler-track"><div class="track-label">⏱ 时间</div><div class="track-clips ruler-clips" id="rulerClips" style="width:${totalW}px;">${ticks}</div></div>`;

  // 遍历所有轨道（列表顺序即图层 z 序：靠后在上层）
  state.tracks.forEach((tr)=>{
    const eyeOff = tr.hidden ? 'off':'';
    const eyePath = tr.hidden ? 'M2 2l20 20' : 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z';
    const safeTid=escapeHtml(tr.id);
    let labelInner = `${kindIcon(tr.kind)} ${escapeHtml(trackDisplayName(tr))}`;
    if(tr.kind!=='audio') labelInner += `<span class="lbtn eye ${eyeOff}" data-eye="${safeTid}" title="显示/隐藏该轨"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="${eyePath}" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg></span>`;
    if(tr.kind==='audio'){
      labelInner += `<span class="lbtn ${(tr.muted?'off':'')}" data-mute="${safeTid}" title="静音 / 取消静音">🔇</span>`;
    }
    let clipsHtml='';
    if(tr.kind==='video'){
      (tr.clips||[]).forEach((c,ci)=>{ const left=c.start*pps, w=Math.max((c.end-c.start)*pps,12);
        const sel = state.selClip&&state.selClip.tid===tr.id&&state.selClip.index===ci;
        const tBadge = (c.rotate||c.flip_h||c.flip_v||c.crop||Math.abs((c.speed||1)-1)>0.01) ? ' ✦' : '';
        clipsHtml+=`<div class="clip clip-video ${sel?'sel':''} ${c.hidden?'clip-hidden':''}" data-track="${safeTid}" data-kind="video" data-i="${ci}" style="left:${left}px;width:${w}px;" title="视频 ${fmtSec(c.start)}–${fmtSec(c.end)}${c.hidden?'（隐藏）':''}${tBadge?'（已剪辑）':''}">${c.hidden?'🙈 ':''}视频 ${ci+1}${tBadge}</div>`;
      });
    } else if(tr.kind==='subtitle'){
      (tr.cues||[]).forEach((c,ci)=>{ const left=c.start*pps, w=Math.max((c.end-c.start)*pps,12);
        const vc=voiceCode(c); const g=vc==='f'||vc==='f2'?`<span class="badge badge-f">${vc==='f2'?'女2':'女1'}</span>`:(vc==='m'||vc==='m2'?`<span class="badge badge-m">${vc==='m2'?'男2':'男1'}</span>`:(vc==='n'||vc==='n2'?`<span class="badge" style="background:#7a6bb7;">${vc==='n2'?'旁2':'旁1'}</span>`:''));
        const label=String(c.text||'').replace(VOICE_TAG_RE,'');
        const sel = state.selRows.has(ci) || state.selected===ci;
        clipsHtml+=`<div class="clip clip-sub ${sel?'sel':''} ${c.hidden?'clip-hidden':''}" data-track="${safeTid}" data-kind="subtitle" data-i="${ci}" style="left:${left}px;width:${w}px;" title="${escapeHtml(label)}">
          <span class="clip-handle left" data-handle="left" data-track="${safeTid}" data-i="${ci}"></span>
          ${g}${escapeHtml(label.slice(0,26))}
          <span class="clip-handle right" data-handle="right" data-track="${safeTid}" data-i="${ci}"></span>
        </div>`;
      });
    } else if(tr.kind==='audio'){
      const sel=state.selClip&&state.selClip.tid===tr.id;
      clipsHtml+=`<div class="clip clip-audio ${tr.muted?'clip-hidden':''} ${tr.dubbed?'dubbed':''} ${sel?'sel':''}" data-track="${safeTid}" data-kind="audio" data-i="0" style="left:0;width:${Math.max(dur*pps,12)}px;" title="${tr.dubbed?'已配音':'音频'}">${tr.dubbed?'🎤 已配音':'🎵 音频'}</div>`;
    } else if(tr.kind==='image'){
      (tr.clips||[]).forEach((c,ci)=>{ const left=c.start*pps, w=Math.max((c.end-c.start)*pps,12);
        const sel = state.selClip&&state.selClip.tid===tr.id&&state.selClip.index===ci;
        clipsHtml+=`<div class="clip clip-image ${sel?'sel':''} ${c.hidden?'clip-hidden':''}" data-track="${safeTid}" data-kind="image" data-i="${ci}" style="left:${left}px;width:${w}px;" title="图片 ${fmtSec(c.start)}–${fmtSec(c.end)}">
          <span class="clip-handle left" data-handle="left" data-track="${safeTid}" data-kind="image" data-i="${ci}"></span>🖼️ 图片 ${ci+1}<span class="clip-handle right" data-handle="right" data-track="${safeTid}" data-kind="image" data-i="${ci}"></span></div>`;
      });
    }
    const activeSubtitle=(tr.kind==='subtitle' && state.activeSubtitleTid===tr.id) ? 'active-subtitle' : '';
    html += `<div class="track ${tr.hidden?'track-hidden':''} ${activeSubtitle}" data-tid="${safeTid}"><div class="track-label" data-tid="${safeTid}">${labelInner}</div><div class="track-clips" style="width:${totalW}px;">${clipsHtml}</div></div>`;
  });

  html += `<div class="playhead" id="playhead" style="left:${labelW}px;"></div>`;
  wrap.innerHTML = html;

  // 事件
  wrap.querySelectorAll('.clip').forEach(c=>{
    if(c.dataset.kind==='audio' || c.dataset.kind==='video'){
      c.onpointerdown=(e)=>{ if(e.target.classList.contains('clip-handle')) return; e.stopPropagation(); selectClip(c.dataset.track,c.dataset.kind,parseInt(c.dataset.i),e); };
    } else {
      // 视频/图片/字幕片段：按住拖动 = 左右移动（改变在时间轴上的位置）
      c.onpointerdown=(e)=>{ if(e.target.classList.contains('clip-handle')) return; startClipMove(c.dataset.track, c.dataset.kind, parseInt(c.dataset.i), e); };
    }
  });
  wrap.querySelectorAll('.clip-handle').forEach(h=> h.onpointerdown=(e)=>{ const clip=h.closest('.clip'); startEdgeDrag(h.dataset.track, clip?clip.dataset.kind:h.dataset.kind, parseInt(h.dataset.i), h.dataset.handle, e); });
  wrap.querySelectorAll('[data-eye]').forEach(b=> b.onclick=(ev)=>{ ev.stopPropagation(); toggleTrackHide(b.dataset.eye); });
  wrap.querySelectorAll('[data-mute]').forEach(b=> b.onclick=(ev)=>{ ev.stopPropagation(); toggleTrackMute(b.dataset.mute); });
  // 点击字幕轨标签决定右侧精修与“语音生成”使用哪一条字幕轨；小眼睛不触发切换。
  wrap.querySelectorAll('.track-label[data-tid]').forEach(label=> label.onclick=(ev)=>{
    if(ev.target.closest('.lbtn')) return;
    const tr=trackById(label.dataset.tid); if(!tr || tr.kind!=='subtitle') return;
    state.activeSubtitleTid=tr.id; state.selected=null; state.selRows.clear(); renderTracks(); renderProps(); renderSubsList();
  });
  wrap.querySelectorAll('[data-dub]').forEach(b=> b.onclick=(ev)=>{ ev.stopPropagation(); dubTrack(b.dataset.dub); });
  // 轨道上下排序（整行均可拖拽；片段和隐藏工具自身不触发）
  wrap.querySelectorAll('.track[data-tid]').forEach(tr=>{
    tr.addEventListener('pointerdown',(e)=> startTrackReorder(tr.dataset.tid, e));
  });
  // 仅由 pointerdown 处理时间尺定位，避免 click + pointerdown 双次 seek 导致指针偶发回跳。
  $('rulerClips').onclick=null;
  $('rulerClips').onpointerdown=(e)=>{ e.stopPropagation(); startScrub(e, pps, labelW); };
  wrap.onclick=(e)=>{ if(e.target.closest('.clip')) return; if(state.selClip){ state.selClip=null; renderTracks(); } };
  updatePlayhead();
  renderClipToolbar();
  layoutOutputFrame(); applyPreviewTransform();   // 选中/取消选中 → 预览实时反映旋转/翻转/裁剪
}
function seekToClientX(clientX, pps, labelW){
  const v=$('video'); if(!v) return;
  const body=$('tracks')?.closest('.tl-body'); const rect=(body||$('rulerClips')).getBoundingClientRect();
  // 用滚动容器坐标换算，放大后横向滚动也不会因 ruler 子元素矩形变化而失准。
  let t=(clientX-rect.left+(body?body.scrollLeft:0)-labelW)/pps;
  t=Math.max(0, t);
  const valid=seekToValidPlayhead(t);
  if(valid==null){ toast('该时间段已删除或隐藏'); return; }
  t=valid;
  v.currentTime=t;
  for(const el of previewLayers.values()){ if(el!==v && el.readyState>=1){ try{el.currentTime=t;}catch(_){} } }
  updatePreviewLayers(t,true); updatePlayhead(); syncRefineToPlayhead();
}
function startScrub(e, pps, labelW){
  e.preventDefault();
  beginDrag({type:'scrub'},
    (ev)=>{ seekToClientX(ev.clientX, pps, labelW); },
    (ev)=>{}
  );
  seekToClientX(e.clientX, pps, labelW);
}
function updatePlayhead(){
  const ph=$('playhead'); const v=$('video'); if(!ph) return;
  const pps=pxPerSec(); const t=(v&&isFinite(v.currentTime))?v.currentTime:0;
  ph.style.left=(88 + t*pps)+'px';
  updateSubtitleOverlay();
  if(v && !v.paused) syncRefineToPlayhead();
}
// 预览只播放「活动（未隐藏）视频片段」覆盖的时间区间；被删除/隐藏的片段及其间隙在播放时会被跳过
function activeVideoSegments(){
  return state.tracks.filter(t=>t.kind==='video'&&!t.hidden).flatMap(t=>(t.clips||[])
    .filter(c=>!c.hidden).map(c=>({start:c.start||0, end:c.end||0})))
    .sort((a,b)=>a.start-b.start);
}
function seekToValidPlayhead(t){
  const segs=activeVideoSegments(); if(!segs.length) return null;   // 没有活动片段 → 无内容可播
  for(const s of segs){ if(t>=s.start && t<s.end) return t; }        // 落在某片段内 → 保持当前位置
  const nxt=segs.find(s=> s.start > t + 0.05);                      // 落在间隙/被删区 → 跳到下一片段起点
  return nxt ? nxt.start : null;                                    // null = 已越过最后片段 → 暂停
}
function selectClip(tid, kind, index, e){
  // 字幕轨：时间轴与列表共用同一套 Ctrl/⌘+点击多选、Shift+点击范围多选（state.selRows）
  if(kind==='subtitle'){
    state.activeSubtitleTid=tid;
    const ev=e||window.event, ctrl=!!(ev&&(ev.ctrlKey||ev.metaKey)), shift=!!(ev&&ev.shiftKey);
    const tr=trackById(tid); const cues=tr?tr.cues:[];
    if(ctrl){
      if(state.selRows.has(index)) state.selRows.delete(index); else state.selRows.add(index);
      state.lastSel=index; state.selected=index; state.selClip=null;   // 多选态不弹单片段工具条
      renderSubsList(); renderTracks(); renderProps(); return;
    }
    if(shift && state.lastSel!=null){
      const a=Math.min(state.lastSel,index), b=Math.max(state.lastSel,index);
      for(let k=a;k<=b;k++) state.selRows.add(k);
      state.selected=index; state.selClip=null;
      renderSubsList(); renderTracks(); renderProps(); return;
    }
    // 普通单击：单选（清空多选，弹单片段工具条：分割/删除/隐藏）
    state.selRows.clear(); state.selected=index; state.lastSel=index;
    state.selClip={tid, kind, index};
    renderSubsList(); renderTracks(); renderProps();
    return;
  }
  // 视频/音频/图片：单选 + 浮动工具条
  state.selClip={tid, kind, index};
  state.selected=null; state.selRows.clear();   // 切到非字幕轨时，清掉字幕单选高亮，避免时间轴脏选中
  renderTracks();
  // 视频编辑器位于左侧设置面板；选中片段后必须立即刷新属性面板。
  renderProps();
  if(kind==='subtitle'){ const v=$('video'); const tr=trackById(tid); if(v&&tr&&tr.cues[index]){ v.currentTime=tr.cues[index].start; updatePlayhead(); } }
}
function renderClipToolbar(){

  if(kind==='audio'){

// 时间轴片段操作：基于 tracks 模型（tid/kind/index）
async function splitClip(tid, kind, i){
  const v=$('video'); const t=(v&&isFinite(v.currentTime))?v.currentTime:0;
  const tr=trackById(tid); if(!tr) return;
  if(kind==='video' || kind==='image'){
    const c=tr.clips[i]; if(!c) return;
    if(t<=c.start+0.1 || t>=c.end-0.1){ toast('播放头需在该片段内部才能分割', true); return; }
    const speed=c.speed||1;
    const src0=c.source_start!=null?Number(c.source_start):0;
    const src1=c.source_end!=null?Number(c.source_end):src0+(c.end-c.start)*speed;
    const mk=(s2,e2,ss,ee)=>({start:s2, end:e2, source_start:ss, source_end:ee, hidden:c.hidden, rotate:c.rotate||0, flip_h:!!c.flip_h, flip_v:!!c.flip_v, crop:c.crop||null, speed, x:c.x!=null?c.x:0.5, y:c.y!=null?c.y:0.5, scale:c.scale!=null?c.scale:1, opacity:c.opacity!=null?c.opacity:1});
    const cutSrc=src0+(t-c.start)*speed;
    const a=mk(c.start, t, src0, cutSrc), b=mk(t, c.end, cutSrc, src1);
    pushHistory();
    tr.clips.splice(i,1,a,b);
    toast('已分割'+kindName(kind)+'片段');
  } else if(kind==='subtitle'){
    const s=tr.cues[i]; if(!s) return;
    if(t<=s.start+0.1 || t>=s.end-0.1){ toast('播放头需在该字幕内部才能分割', true); return; }
    const mid=t;
    const head=(s.text||'').slice(0, Math.ceil((s.text.length)*((mid-s.start)/(s.end-s.start||1))));
    const tail=(s.text||'').slice(head.length);
    const a={start:s.start, end:mid, text:head.trim(), hidden:s.hidden, style:s.style||null};
    const b={start:mid, end:s.end, text:tail.trim(), hidden:s.hidden, style:s.style||null};
    pushHistory();
    tr.cues.splice(i,1,a,b);
    toast('已分割字幕');
    renderSubsList();
  }
  state.selClip=null; renderTracks(); syncPreviewSource(); await saveTracks();
}
async function deleteClip(tid, kind, i){
  const tr=trackById(tid); if(!tr) return;
  stopPoll();   // 停轮询，避免后台任务把已删片段/轨重新绑回
  // 删除视频/图片片段时，若有后台分离/去人声任务在跑，先中止，避免结束后冒出孤儿音频
  if(state.job && state.job.status==='running'){ try{ await api(`/api/jobs/${state.jid}/task/abort`,{method:'POST'}); }catch(e){} }
  if(kind==='video' || kind==='image'){
    tr.clips.splice(i,1);
    // 该片段就是整根轨道（删完空了）→ 直接删除整根轴
    if(tr.clips.length===0){ state.selClip=null; await deleteMediaFromTimeline(tid); return; }
    pushHistory();
    toast('已删除'+kindName(kind)+'片段');
  } else if(kind==='subtitle'){
    tr.cues.splice(i,1);
    // 该字幕就是整根轨道（删完空了）→ 直接删除整根轴
    if(tr.cues.length===0){ state.selClip=null; await deleteMediaFromTimeline(tid); return; }
    pushHistory();
    if(state.selected===i) state.selected=null;
    const ns=new Set(); state.selRows.forEach(r=>{ if(r<i) ns.add(r); else if(r>i) ns.add(r-1); }); state.selRows=ns;
    toast('已删除字幕');
    renderSubsList();
  }
  state.selClip=null; renderTracks(); syncPreviewSource(); await saveTracks();
}

async function saveTracks(){

  });
  state.saveChain=run.catch(()=>{});

}

// 拖拽片段左右边缘改入/出点（视频 / 字幕 / 图片通用）
function startEdgeDrag(tid, kind, i, handle, e){
  if(_drag) return;
  if(e.button!==0) return;
  e.preventDefault(); e.stopPropagation();
  const tr=trackById(tid); if(!tr) return;
  const cur = kind==='subtitle' ? tr.cues[i] : tr.clips[i];
  if(!cur) return;
  pushHistory();
  const pps=pxPerSec();
  const startX=e.clientX;
  const oStart=parseFloat(cur.start)||0, oEnd=parseFloat(cur.end)||0;
  const minDur=0.1;
  beginDrag({type:'edge'},
    (ev)=>{
      const d=(ev.clientX-startX)/pps;
      if(handle==='left'){ cur.start=clamp(oStart+d, 0, oEnd-minDur); }
      else { cur.end=Math.max(cur.start+minDur, oEnd+d); }
      const node=document.querySelector(`.clip[data-track="${tid}"][data-i="${i}"]`);
      if(node){ const left=cur.start*pps, w=Math.max((cur.end-cur.start)*pps,12); node.style.left=left+'px'; node.style.width=w+'px'; node.title=(kindName(kind)+' ')+fmtSec(cur.start)+'–'+fmtSec(cur.end); }
    },
    (ev)=>{ saveTracks().then(()=>renderTracks()).catch(()=>{}); if(kind==='audio') updateAudioPreviewLayers(video.currentTime||0); }
  );
}

/* ---------- 视频字幕叠加 / 播放交互 ---------- */
const video=$('video');

// 计算视频在 preview-stage 内（object-fit:contain）实际显示的信箱矩形
function videoRect(){
  const stage=$('previewStage'); if(!stage) return {dx:0,dy:0,dw:stage.clientWidth||0,dh:stage.clientHeight||0};
  const sw=stage.clientWidth, sh=stage.clientHeight;
  const vw=video.videoWidth||16, vh=video.videoHeight||9;
  const sAR=sw/sh, vAR=vw/vh;
  let dw,dh,dx,dy;
  if(vAR>sAR){ dw=sw; dh=sw/vAR; dx=0; dy=(sh-dh)/2; }
  else { dh=sh; dw=sh*vAR; dx=(sw-dw)/2; dy=0; }
  return {dx,dy,dw,dh};
}
// 把输出帧（=ffmpeg scale+pad 到的源分辨率）按源比例 contain 进预览舞台并居中
function layoutOutputFrame(){
  const stage=$('previewStage'), frame=$('outputFrame');
  if(!stage||!frame) return;
  const sw=stage.clientWidth, sh=stage.clientHeight;
  if(!sw||!sh) return;                       // 隐藏时尺寸为 0，跳过以免清零
  const vw=video.videoWidth||16, vh=video.videoHeight||9;
  const sAR=vw/vh, stageAR=sw/sh;
  let fw,fh;
  if(sAR>stageAR){ fw=sw; fh=Math.round(sw/sAR); } else { fh=sh; fw=Math.round(sh*sAR); }
  frame.style.width=fw+'px'; frame.style.height=fh+'px';
}
// 预览实时反映「选中视频片段」的旋转/翻转/裁剪（变速仅导出生效，不在此反映）
function applyPreviewTransform(){
  const layer=$('transformLayer'), crop=$('cropLayer'), overlay=$('subOverlay');
  if(!layer||!crop) return;
  let rotate=0, fx=1, fy=1, cropMode='none';
  const c = (state.selClip && state.selClip.kind==='video') ? (function(){ const tr=trackById(state.selClip.tid); return tr?tr.clips[state.selClip.index]:null; })() : null;
  if(c){ rotate=parseInt(c.rotate||0)||0; fx=c.flip_h?-1:1; fy=c.flip_v?-1:1; cropMode=(c.crop&&c.crop.mode)||'none'; }
  const tf=`rotate(${rotate}deg) scale(${fx},${fy})`;
  layer.style.transform=tf;                  // 旋转/翻转
  if(overlay) overlay.style.transform=tf;    // 字幕随视频同步旋转/翻转（裁剪不裁字幕，符合导出）
  // 裁剪遮罩：在输出帧（屏幕/源比例）空间内裁剪，故旋转后仍正确（先转后裁）
  const vw=video.videoWidth||16, vh=video.videoHeight||9;
  let clip='';
  if(cropMode==='1:1'){
    const side=Math.min(vw,vh); const lx=(vw-side)/2/vw*100, ly=(vh-side)/2/vh*100;
    clip=`inset(${ly}% ${lx}% ${ly}% ${lx}%)`;
  } else if(cropMode==='9:16'){
    const tw=Math.min(vw, Math.round(vh*9/16)); const lx=(vw-tw)/2/vw*100;
    clip=`inset(0% ${lx}% 0% ${lx}%)`;
  } else if(cropMode==='4:5'){
    const tw=Math.min(vw, Math.round(vh*4/5)); const lx=(vw-tw)/2/vw*100;
    clip=`inset(0% ${lx}% 0% ${lx}%)`;
  }
  crop.style.clipPath = clip || 'none';
}
// 当前时间命中的所有可见字幕轨：中/目标语言默认同时显示，隐藏轨道即可单独核对。
function currentSubText(){
  if(!video || !isFinite(video.currentTime)) return null;
  const t=video.currentTime;
  const lines=[];
  state.tracks.filter(tr=>tr.kind==='subtitle'&&!tr.hidden).forEach(tr=>{
    const c=(tr.cues||[]).find(x=>!x.hidden && t>=(x.start||0) && t<=(x.end||0));
    if(c&&c.text) lines.push(String(c.text).replace(VOICE_TAG_RE,''));
  });
  return lines.length?lines.join('\n'):null;
}
// 当前时间命中的活动字幕句（取其逐行样式）；按时间匹配，跳过 hidden
function currentSeg(){
  if(!video || !isFinite(video.currentTime)) return null;
  const t=video.currentTime;
  const sh=state.subShift||0;
  const st=activeSubtitleTrack();
  if(st && st.cues){ for(const c of st.cues){ if(c.hidden) continue; const a=(c.start||0)+sh, b=(c.end||0)+sh; if(t>=a && t<=b) return c; } }
  return null;
}
function updateSubtitleOverlay(){
  const overlay=$('subOverlay'), anchor=$('subAnchor'), stage=$('previewStage'), frame=$('outputFrame');
  if(!overlay || !stage || !frame) return;
  if(stage.classList.contains('hidden')){ overlay.style.display='none'; return; }
  overlay.style.display='block';
  // 字幕层现贴合 output-frame（= 视频实际显示区），充满即可（已随视频旋转/翻转同步）
  overlay.style.left='0'; overlay.style.top='0'; overlay.style.width='100%'; overlay.style.height='100%';
  const txt=currentSubText();
  if(!txt){ anchor.classList.add('hidden'); anchor.textContent=''; return; }
  anchor.classList.remove('hidden'); let resizeHandle=$('subResize'); anchor.textContent=txt;
  if(!resizeHandle){ resizeHandle=document.createElement('span'); resizeHandle.id='subResize'; resizeHandle.className='sub-resize'; resizeHandle.addEventListener('pointerdown',subResizeStart); }
  anchor.appendChild(resizeHandle);
  // 逐行样式优先，否则用全局默认（预览所见=导出所得）
  const cur=currentSeg();
  const st=(cur && cur.style) ? cur.style : (state.subStyle||DEFAULT_SUB_STYLE);
  const scale = (frame.clientHeight||video.videoHeight||1080)/1080;   // 以 1080 高为基准缩放字号
  anchor.style.fontSize=(st.font_size*scale)+'px';
  anchor.style.color=st.color;
  anchor.style.fontWeight=st.bold?'700':'400';
  anchor.style.textShadow=st.outline?'-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000':'0 1px 2px rgba(0,0,0,.6)';
  // 默认时也明确指定与 ASS 导出相同的高棉字体；中文等缺失字形再回退到中文字体。
  // 不再让浏览器任意回退，保证预览与导出的字形度量、字号和换行一致。
  anchor.style.fontFamily = st.font ? st.font : "'Noto Sans Khmer','Noto Sans SC','Microsoft YaHei','PingFang SC',sans-serif";
  if(st.bg){ anchor.style.background=hexA(st.bg_color, st.bg_opacity); anchor.style.padding='0.12em 0.45em'; anchor.style.borderRadius='0.25em'; }
  else { anchor.style.background='transparent'; anchor.style.padding='0'; }
  anchor.style.left=(st.x*100)+'%'; anchor.style.top=(st.y*100)+'%';
  // 字幕框宽度始终保持可编辑；拖拽右下角可调整 box_width，背景随字幕框显示。
  anchor.style.width=(clamp(Number(st.box_width)||0.92,0.1,1)*100)+'%';
  anchor.style.maxWidth=(clamp(Number(st.box_width)||0.92,0.1,1)*100)+'%';
  anchor.style.height=(Number(st.box_height)>0?clamp(Number(st.box_height),0.05,1)*100+'%':'auto');
  anchor.style.overflow='hidden';
}
function subResizeStart(e){
  if(e.button!==0) return; e.preventDefault(); e.stopPropagation(); _dragPre=snapshotDoc();
  const ov=$('subOverlay').getBoundingClientRect(), ar=$('subAnchor').getBoundingClientRect();
  const cx=ar.left+ar.width/2, cy=ar.top+ar.height/2;
  beginDrag({type:'subresize'},(ev)=>{ const ov=$('subOverlay').getBoundingClientRect(); const cur=currentSeg(); const target=(cur&&cur.style)?cur.style:state.subStyle;
    // 以字幕框中心为基准计算尺寸，拖动过程中中心和位置不漂移。
    target.box_width=clamp(Math.abs(ev.clientX-cx)*2/ov.width,0.1,1);
    target.box_height=clamp(Math.abs(ev.clientY-cy)*2/ov.height,0,1); updateSubtitleOverlay();
  },()=>{ const cur=currentSeg(); if(cur&&cur.style) saveSubs(); else saveSubStyle(); if(_dragPre && snapshotDoc()!==_dragPre) pushSnap(_dragPre); _dragPre=null; });
}

/* ---------- 字幕样式面板（字号/颜色/背景/加粗/位置 + 预览拖动） ---------- */
let _styleSaveT=null;
function normalizedSubStyle(style){
  const s=Object.assign({}, DEFAULT_SUB_STYLE, style||{});
  const num=(v, fallback, lo, hi)=>{ v=Number(v); return Number.isFinite(v)?clamp(v,lo,hi):fallback; };
  const hex=(v, fallback)=>/^#[0-9a-f]{6}$/i.test(String(v||'')) ? String(v) : fallback;
  return {
    font_size:Math.round(num(s.font_size,DEFAULT_SUB_STYLE.font_size,8,200)), color:hex(s.color,'#FFFFFF'), bg:!!s.bg,
    bg_color:hex(s.bg_color,'#000000'), bg_opacity:num(s.bg_opacity,0.55,0,1), bold:!!s.bold, outline:!!s.outline,
    position:['bottom','middle','top','custom'].includes(s.position)?s.position:'bottom', x:num(s.x,0.5,0,1), y:num(s.y,0.85,0,1),
    font:String(s.font||'').slice(0,120),
    box_width:num(s.box_width,0.92,0.1,1), box_height:num(s.box_height,0,0,1),
  };
}

      let path='';
      if(kind==='quick'){
        const video=(job.tracks||[]).find(t=>t.kind==='video'); if(!video) throw new Error('没有视频轨');
        path=`/api/jobs/${project.id}/tracks/${video.id}/quick_make`;
      }else if(kind==='translate') path=`/api/jobs/${project.id}/tracks/${project.selected_subtitle_tid}/translate`;
      else if(kind==='synthesize') path=`/api/jobs/${project.id}/tracks/${project.selected_subtitle_tid}/synthesize`;
      else if(kind==='export') path=`/api/jobs/${project.id}/export`;
      await api(path,{method:'POST'});
      await waitForProjectTask(project.id,project.title||project.id);
      await saveProjectBatchResult(project,kind,'success','批量操作已完成');
    }catch(e){
      failures.push(`${project.title||project.id}：${e.message}`);
      await saveProjectBatchResult(project,kind,'failed',e.message);
    }
  }
  projectBatchRunning=false; updateProjectSelectionUI();
  if(failures.length) toast(`${PROJECT_ACTION_LABEL[kind]}已部分启动；${failures.join('；')}`,true);
  else toast(`已顺序完成 ${loaded.length} 个项目的${PROJECT_ACTION_LABEL[kind]}`);
}
async function saveProjectBatchResult(project,action,state,message){
  project.batch_results=project.batch_results||{};
  project.batch_results[action]={state,message,updated_at:Date.now()/1000};
  renderProjectLibrary(projectLibraryItems);
  try{
    await api(`/api/projects/${project.id}/batch_result`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,state,message:String(message||'').slice(0,500)})});
  }catch(e){
    // 结果已在当前项目卡显示；不让记录接口故障中断后续项目的顺序处理。
    console.warn('保存项目库批量结果失败',e);
  }
}
async function createNewProject(){
  try{
    const r=await api('/api/projects/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'未命名项目'})});
    location.href=PREFIX+'/?job='+encodeURIComponent(r.id);
  }catch(e){ toast('新建项目失败: '+e.message,true); }
}
async function saveCurrentProject(){
  if(!state.jid){ await createNewProject(); return; }
  const name=($('projName').value||'').trim()||'未命名项目';
  toast('正在保存项目…');
  try{
    if(state.job) state.job.title=name;
    await renameJob(name);
    await saveTracks();
    await saveSubStyleNow();
    await api(`/api/jobs/${state.jid}/sub_shift`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shift:state.subShift||0})});
    const r=await api(`/api/jobs/${state.jid}/save_project`,{method:'POST'});
    if(state.job) Object.assign(state.job,{project_saved_at:r.project.updated_at,project_file:r.project.project_file});
    toast(`项目“${r.project.title}”已保存`);
  }catch(e){ toast('保存项目失败: '+e.message,true); }
}
$('saveProjectBtn').onclick=saveCurrentProject;
$('newProjectTopBtn').onclick=createNewProject;

$('newProjectBtn').onclick=createNewProject;

$('projectTranslate').onclick=()=>startProjectAction('translate');

const SUB_COLORS=["#FFFFFF","#FFFF00","#00FFFF","#00FF00","#FF8888","#FFB300"];

/* ---------- 字体：从 GET /api/fonts 加载，注入 @font-face，供预览与下拉框使用 ---------- */
let FONT_LIST = [{family:"系统默认", url:""}];   // 默认项：用浏览器/CSS 默认字体
async function loadFonts(){
  try{
    const list = await api('/api/fonts');
    if(Array.isArray(list) && list.length) FONT_LIST = list;
  }catch(e){ /* 失败则用系统默认 */ }
  // 注入 @font-face（空 url 的“系统默认”跳过）
  let css='';
  for(const f of FONT_LIST){
    if(f.url) css += `@font-face{font-family:${JSON.stringify(f.family)};src:url('${f.url}') format('woff2');font-display:swap;}`;
  }
  let styleEl=document.getElementById('fontFaceStyle');
  if(!styleEl){ styleEl=document.createElement('style'); styleEl.id='fontFaceStyle'; document.head.appendChild(styleEl); }
  styleEl.textContent=css;
  // 样式面板若已渲染则刷新下拉
  if($('ssFont')) renderSubStyle();
}
// 字幕样式卡片的编辑目标：优先多选 selRows，其次单选 state.selected，都没有则改全局默认
function styleTargets(){
  const cues=editableSubtitleCues();
  if(state.selRows.size>0) return [...state.selRows];
  if(state.selected!=null && cues[state.selected]) return [state.selected];
  return null;
}
// 把样式补丁应用到「选中字幕」；无选中时才改全局默认（避免误伤其它句）
function applyStyleToTargets(patch){
  const t=styleTargets();
  if(t){
    const cues=editableSubtitleCues();
    t.forEach(i=>{ const s=cues[i]; if(!s) return; s.style=Object.assign({}, state.subStyle, s.style||{}, patch); });
    saveSubs();
  } else {
    Object.assign(state.subStyle, patch);
    saveSubStyle();
  }
  updateSubtitleOverlay();
}
function renderSubStyle(){
  const box=$('subStyleCard'); if(!box) return;
  // 有选中字幕时，面板必须显示该句真实的逐句样式，而不是过期的全局默认值。
  const cues=editableSubtitleCues();
  const selectedCue=state.selected!=null ? cues[state.selected] : null;
  const st=Object.assign({}, state.subStyle, (selectedCue&&selectedCue.style)||{});
  const colorSwatches=SUB_COLORS.map(c=>`<div class="swatch ${st.color.toLowerCase()===c.toLowerCase()?'on':''}" data-c="${c}" style="background:${c}"></div>`).join('');
  box.innerHTML=`
    <div class="rail-title" style="padding:0 0 6px;">字幕样式</div>
    <div class="row" style="margin-bottom:8px;">
      <label class="small muted">字体</label>
      <select class="field" id="ssFont"></select>
    </div>
    <div class="inline-field" style="margin-bottom:8px;">
      <label class="small muted" style="width:42px;">字号</label>
      <input type="range" id="ssSize" min="16" max="64" step="1" value="${st.font_size}">
      <span class="val" id="ssSizeV">${st.font_size}</span>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <label class="small muted">颜色</label>
      <div class="swatches">${colorSwatches}<input type="color" id="ssColor" value="${st.color}" title="自定义颜色"></div>
    </div>
    <div class="row" style="margin-bottom:8px;">
      <label class="small muted">背景</label>
      <div class="row" style="gap:6px;">
        <button class="btn btn-sm ${st.bg?'btn-default':'btn-outline'}" id="ssBg">${st.bg?'开':'关'}</button>
        <input type="color" id="ssBgColor" value="${st.bg_color}" title="背景色">
        <input type="range" id="ssBgOp" min="0" max="1" step="0.05" value="${st.bg_opacity}" style="width:70px;" title="背景透明度">
      </div>
    </div>
    <div class="inline-field" style="margin-bottom:8px;">
      <label class="small muted" style="width:42px;">加粗</label>
      <button class="btn btn-sm ${st.bold?'btn-default':'btn-outline'}" id="ssBold">${st.bold?'已加粗':'常规'}</button>
    </div>
    <div class="inline-field" style="margin-bottom:8px;">
      <label class="small muted" style="width:42px;">边框</label>
      <button class="btn btn-sm ${st.outline?'btn-default':'btn-outline'}" id="ssOutline">${st.outline?'已开启':'关闭'}</button>
    </div>
    <div class="row" style="margin-top:6px; gap:6px;">
      <button class="btn btn-sm btn-outline" id="ssApplyAll">应用到全部字幕</button>
    </div>`;
  // 绑定（编辑作用到「选中字幕」，无选中才改全局默认）
  $('ssSize').oninput=(e)=>{ const v=parseInt(e.target.value)||30; $('ssSizeV').textContent=v; applyStyleToTargets({font_size:v}); };
  $('ssSize').onpointerdown=()=>{ _stylePre=snapshotDoc(); };
  $('ssSize').onchange=()=>{ if(_stylePre && snapshotDoc()!==_stylePre){ pushSnap(_stylePre); } _stylePre=null; };
  // 字体下拉（从 GET /api/fonts 加载；用户把字体丢进 fonts/ 刷新即出现）
  if($('ssFont')){
    $('ssFont').innerHTML = FONT_LIST.map(f=>`<option value="${escapeHtml(f.family)}" ${st.font===f.family?'selected':''}>${escapeHtml(f.family)}</option>`).join('');
    $('ssFont').onchange=(e)=>{ const pre=snapshotDoc(); const f=e.target.value; applyStyleToTargets({font:f}); renderSubStyle(); pushSnap(pre); };
  }
  $('ssColor').oninput=(e)=>{ applyStyleToTargets({color:e.target.value}); };
  $('ssColor').onpointerdown=()=>{ _stylePre=snapshotDoc(); };
  $('ssColor').onchange=()=>{ if(_stylePre && snapshotDoc()!==_stylePre){ pushSnap(_stylePre); } _stylePre=null; };
  box.querySelectorAll('.swatch').forEach(sw=> sw.onclick=()=>{ const pre=snapshotDoc(); applyStyleToTargets({color:sw.dataset.c}); renderSubStyle(); pushSnap(pre); });
  $('ssBg').onclick=()=>{ const pre=snapshotDoc(); const nb=!st.bg; applyStyleToTargets({bg:nb}); renderSubStyle(); pushSnap(pre); };
  $('ssBgColor').oninput=(e)=>{ applyStyleToTargets({bg_color:e.target.value}); };
  $('ssBgColor').onpointerdown=()=>{ _stylePre=snapshotDoc(); };
  $('ssBgColor').onchange=()=>{ if(_stylePre && snapshotDoc()!==_stylePre){ pushSnap(_stylePre); } _stylePre=null; };
  $('ssBgOp').oninput=(e)=>{ applyStyleToTargets({bg_opacity:parseFloat(e.target.value)||0}); };
  $('ssBgOp').onpointerdown=()=>{ _stylePre=snapshotDoc(); };
  $('ssBgOp').onchange=()=>{ if(_stylePre && snapshotDoc()!==_stylePre){ pushSnap(_stylePre); } _stylePre=null; };
  $('ssBold').onclick=()=>{ const pre=snapshotDoc(); const nb=!st.bold; applyStyleToTargets({bold:nb}); renderSubStyle(); pushSnap(pre); };
  $('ssOutline').onclick=()=>{ const pre=snapshotDoc(); const no=!st.outline; applyStyleToTargets({outline:no}); renderSubStyle(); pushSnap(pre); };
  if($('ssApplyAll')) $('ssApplyAll').onclick=()=>{
    const pre=snapshotDoc(), cues=editableSubtitleCues();
    // “应用到全部”以当前选中句的实际样式为模板；没有选中句时才使用全局默认。
    // 只作用于当前字幕轨，保持中文字幕与目标语言字幕相互独立，绝不改写字幕文字。
    const current=(state.selected!=null&&cues[state.selected])?cues[state.selected]:null;
    const template=Object.assign({}, state.subStyle, (current&&current.style)||{});
    cues.forEach(s=>{ s.style=Object.assign({}, template); });
    renderSubsList(); updateSubtitleOverlay(); saveSubs();
    toast('已应用到当前轨全部 '+cues.length+' 句'); pushSnap(pre);
  };
  renderSubVoice();
}
function renderSubVoice(){
  const box=$('subVoiceCard'); if(!box) return;
  const cues=editableSubtitleCues(); const selected=state.selected!=null?cues[state.selected]:null;
  const selectedVoice=voiceCode(selected)||'f';
  box.innerHTML=`<div class="rail-title" style="padding:0 0 6px;">声线</div>
    <div class="row" style="gap:5px;flex-wrap:wrap;">
      <select class="field" id="ssVoice" style="width:88px;"><option value="f" ${selectedVoice==='f'?'selected':''}>女声1</option><option value="f2" ${selectedVoice==='f2'?'selected':''}>女声2</option><option value="m" ${selectedVoice==='m'?'selected':''}>男声1</option><option value="m2" ${selectedVoice==='m2'?'selected':''}>男声2</option><option value="n" ${selectedVoice==='n'?'selected':''}>旁白1</option><option value="n2" ${selectedVoice==='n2'?'selected':''}>旁白2</option></select>
      <button class="btn btn-sm btn-outline" id="ssVoiceSelected">应用选中</button>
      <button class="btn btn-sm btn-outline" id="ssVoiceAll">应用全部</button>
    </div>`;
  $('ssVoiceSelected').onclick=()=>applyVoiceToSubtitles($('ssVoice').value);
  $('ssVoiceAll').onclick=()=>applyVoiceToSubtitles($('ssVoice').value,true);
}
// 在预览上拖动字幕改变位置
(function bindSubDrag(){
  const anchor=$('subAnchor'); if(!anchor) return;
  anchor.addEventListener('pointerdown',(e)=>{ e.preventDefault(); e.stopPropagation(); _dragPre=snapshotDoc(); anchor.classList.add('dragging');
    beginDrag({type:'subanchor'},
      (ev)=>{ const ov=$('subOverlay').getBoundingClientRect(); const cur=currentSeg(); const target=(cur&&cur.style)?cur.style:state.subStyle;
        target.x=clamp((ev.clientX-ov.left)/ov.width,0,1); target.y=clamp((ev.clientY-ov.top)/ov.height,0,1); target.position='custom'; updateSubtitleOverlay(); },
      (ev)=>{ anchor.classList.remove('dragging'); const cur=currentSeg(); if(cur&&cur.style) saveSubs(); else saveSubStyle(); if(_dragPre && snapshotDoc()!==_dragPre){ pushSnap(_dragPre); } _dragPre=null; }
    );
  });
  const resize=$('subResize');
  if(resize) resize.addEventListener('pointerdown',subResizeStart);
})();

/* ---------- 缩放 ---------- */
function setZoomAroundPlayhead(value){
  const body=$('tracks')?.closest('.tl-body'); const centerTime=video&&isFinite(video.currentTime)?video.currentTime:0;
  state.zoom=Math.max(0,Math.min(1,value)); renderTracks();
  if(body){ const newPps=pxPerSec(); body.scrollLeft=Math.max(0,88+centerTime*newPps-body.clientWidth/2); }
  updatePlayhead();
}
$('zoom').oninput=e=>setZoomAroundPlayhead(parseFloat(e.target.value));
$('zoomIn').onclick=()=>{ state.zoom=Math.min(1,state.zoom+0.1); $('zoom').value=state.zoom; setZoomAroundPlayhead(state.zoom); };
$('zoomOut').onclick=()=>{ state.zoom=Math.max(0,state.zoom-0.1); $('zoom').value=state.zoom; setZoomAroundPlayhead(state.zoom); };

/* ---------- 撤销 / 重做 ---------- */
$('tlUndo').onclick=()=> undo();
$('tlRedo').onclick=()=> redo();
document.addEventListener('keydown',(e)=>{
  // 空格键统一作为预览播放/暂停快捷键；编辑文本时保留输入空格。
  const target=e.target, tag=(target&&target.tagName)||'';
  const editing=tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||!!(target&&target.isContentEditable);
  if((e.code==='Space'||e.key===' ')&&!editing){ e.preventDefault(); e.stopPropagation(); togglePreviewPlayback(); return; }
  if(!(e.ctrlKey||e.metaKey)) return;
  const activeTag=(document.activeElement&&document.activeElement.tagName)||'';
  if(activeTag==='INPUT'||activeTag==='TEXTAREA') return;   // 输入框聚焦时让原生撤销生效
  const k=e.key.toLowerCase();
  if(k==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if((k==='z'&&e.shiftKey)||k==='y'){ e.preventDefault(); redo(); }
});

/* ---------- 时间轴高度拖拽（document 级监听，绝不卡死） ---------- */
(function(){ const sp=$('splitter'), tw=document.querySelector('.timeline-wrap'); if(!sp) return;
  sp.addEventListener('pointerdown',(e)=>{ e.preventDefault(); document.body.style.cursor='row-resize';
    beginDrag({type:'splitter'},
      (ev)=>{ const h=window.innerHeight-ev.clientY; tw.style.height=Math.max(160,Math.min(window.innerHeight*0.7,h))+'px'; },
      (ev)=>{ document.body.style.cursor=''; }
    );
  });
})();
window.addEventListener('resize', ()=>{ renderTracks(); updateSubtitleOverlay(); layoutOutputFrame(); applyPreviewTransform(); });

/* ---------- 初始化 ---------- */
$('verBadge').textContent = APP_VER;
renderRail(); renderPanes(); render();
loadFonts();   // 异步加载字体清单并注入 @font-face（用户把字体丢进 fonts/ 刷新即出现）
const q=new URLSearchParams(location.search).get('job');
if(q){ state.jid=q; loadJob(); }
</script>
